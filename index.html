<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f5f6f8">
<title>Hjemmelager</title>

<style>
:root {
    --bg:#f5f6f8;
    --card:#fff;
    --text:#202631;
    --muted:#77808d;
    --accent:#3867e8;
    --border:#e5e8ee;
    --danger:#d94b4b;
}
* { box-sizing:border-box; }
body {
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:var(--bg);
    color:var(--text);
    padding-bottom:100px;
}
header { padding:25px 20px 12px; }
header h1 { margin:0; font-size:28px; font-weight:750; }
header p { color:var(--muted); margin:6px 0 0; font-size:14px; }
main { padding:12px 16px; max-width:700px; margin:auto; }
.search {
    width:100%; padding:15px; border:1px solid var(--border);
    border-radius:14px; font-size:16px; background:white; margin-bottom:14px;
}
.primary {
    width:100%; border:0; border-radius:13px; background:var(--accent);
    color:white; padding:15px; font-size:16px; font-weight:650;
    cursor:pointer; margin-bottom:16px;
}
.item {
    background:var(--card); border-radius:16px; padding:14px;
    margin-bottom:12px; display:flex; gap:13px; border:1px solid var(--border);
}
.item img {
    width:86px; height:86px; object-fit:cover;
    border-radius:11px; background:var(--bg);
}
.item-content { flex:1; min-width:0; }
.item h3 { margin:2px 0 6px; font-size:17px; }
.item p {
    color:var(--muted); font-size:13px; margin:3px 0; overflow-wrap:anywhere;
}
.actions { display:flex; gap:8px; margin-top:9px; }
.small-btn {
    border:0; padding:8px 12px; border-radius:9px;
    background:#edf1fa; color:var(--accent); font-weight:600; cursor:pointer;
}
.delete-btn { background:#fff0f0; color:var(--danger); }
.section { display:none; }
.section.active { display:block; }
.form-card,.settings-card {
    background:white; border:1px solid var(--border);
    border-radius:16px; padding:17px; margin-bottom:15px;
}
.form-card h2,.settings-card h2 { margin:0 0 15px; }
label { display:block; font-size:13px; font-weight:650; margin:13px 0 6px; }
input,select,textarea {
    width:100%; border:1px solid var(--border); border-radius:10px;
    padding:12px; font-size:16px; background:white; color:var(--text);
}
textarea { min-height:75px; resize:vertical; }

/* Rullbare valgmenyer for lange lister med hyller og bokser */
.select-wrap { position:relative; width:100%; }
.select-trigger {
    width:100%; min-height:46px; text-align:left; padding:12px 42px 12px 12px;
    border:1px solid var(--border); border-radius:10px; background:white;
    color:var(--text); font-size:16px; position:relative; cursor:pointer;
}
.select-trigger::after {
    content:""; position:absolute; right:15px; top:17px; width:9px; height:9px;
    border-right:2px solid var(--muted); border-bottom:2px solid var(--muted);
    transform:rotate(45deg); pointer-events:none;
}
.select-menu {
    display:none; position:absolute; left:0; right:0; top:calc(100% + 5px);
    max-height:min(45vh, 320px); overflow-y:auto; -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain; background:white; border:1px solid var(--border);
    border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,.14); z-index:30;
}
.select-wrap.open .select-menu { display:block; }
.select-option {
    display:block; width:100%; border:0; border-bottom:1px solid var(--border);
    background:white; color:var(--text); text-align:left; padding:13px 12px;
    min-height:44px; font-size:16px; cursor:pointer;
}
.select-option:last-child { border-bottom:0; }
.select-option:active, .select-option.selected { background:#edf1fa; color:var(--accent); }
.select-option:focus-visible, .select-trigger:focus-visible {
    outline:2px solid var(--accent); outline-offset:2px;
}

.form-buttons { display:flex; gap:10px; margin-top:18px; }
.form-buttons button { flex:1; margin:0; }
.secondary { background:#e9edf4; color:var(--text); }
.setting-row { display:flex; gap:8px; margin:10px 0; }
.setting-row input { flex:1; }
.setting-row button {
    border:0; border-radius:9px; padding:0 13px;
    background:#fff0f0; color:var(--danger); font-weight:600;
}
.empty { text-align:center; padding:35px 15px; color:var(--muted); }
nav {
    position:fixed; bottom:0; left:0; right:0;
    display:grid; grid-template-columns:repeat(4,1fr);
    background:rgba(255,255,255,.97); border-top:1px solid var(--border);
    padding:9px 5px calc(9px + env(safe-area-inset-bottom)); z-index:10;
}
nav button {
    border:0; background:transparent; color:var(--muted);
    font-size:12px; font-weight:600; padding:7px 2px; cursor:pointer;
}
nav button span { display:block; font-size:21px; margin-bottom:3px; }
nav button.active { color:var(--accent); }
h2.page-title { font-size:22px; margin:8px 0 17px; }
#imagePreview {
    display:none; width:110px; height:110px;
    object-fit:cover; border-radius:12px; margin-top:10px;
}
.info { color:var(--muted); font-size:13px; line-height:1.5; }
</style>
</head>

<body>

<header>
    <h1>Hjemmelager</h1>
    <p>Hold oversikt over tingene dine</p>
</header>

<main>

<section id="lager" class="section active">
    <input class="search" id="searchInput" type="search"
           placeholder="Søk etter ting..." oninput="renderItems()">

    <button class="primary" onclick="newItem()">+ Legg til ny ting</button>
    <div id="itemList"></div>
</section>

<section id="innstillinger" class="section">
    <h2 class="page-title">Innstillinger</h2>

    <div class="settings-card">
        <h2>Lokasjoner</h2>
        <div id="locationSettings"></div>
        <div class="setting-row">
            <input id="newLocation" placeholder="Ny lokasjon">
            <button onclick="addSetting('lokasjoner','newLocation')">Legg til</button>
        </div>
    </div>

    <div class="settings-card">
        <h2>Hyller</h2>
        <div id="shelfSettings"></div>
        <div class="setting-row">
            <input id="newShelf" placeholder="Ny hylle">
            <button onclick="addSetting('hyller','newShelf')">Legg til</button>
        </div>
    </div>

    <div class="settings-card">
        <h2>Bokser</h2>
        <div id="boxSettings"></div>
        <div class="setting-row">
            <input id="newBox" placeholder="Ny boks">
            <button onclick="addSetting('bokser','newBox')">Legg til</button>
        </div>
    </div>

    <div class="settings-card">
        <h2>Lagring</h2>
        <p class="info">
            Lageret lagres lokalt i nettleseren. Ta regelmessig backup
            til iCloud Drive for å sikre dataene dine.
        </p>
    </div>
</section>

<section id="rediger" class="section">
    <div class="form-card">
        <h2 id="formTitle">Legg til ting</h2>
        <input type="hidden" id="editId">

        <label for="navn">Navn</label>
        <input id="navn" placeholder="Hva heter tingen?">

        <label for="type">Kategori</label>
        <input id="type" placeholder="F.eks. Verktøy, kjøkken, klær">

        <label for="lokasjon">Lokasjon</label>
        <select id="lokasjon"></select>

        <label for="hylle">Hylle</label>
        <select id="hylle"></select>

        <label for="boks">Boks</label>
        <select id="boks"></select>

        <label for="antall">Antall</label>
        <input id="antall" type="number" min="0" value="1">

        <label for="pris">Pris per stykk (kr)</label>
        <input id="pris" type="number" min="0" step="0.01" placeholder="0">

        <label for="dato">Dato</label>
        <input id="dato" type="date">

        <label for="notat">Notat</label>
        <textarea id="notat" placeholder="Valgfri informasjon"></textarea>

        <label for="bilde">Bilde</label>
        <input id="bilde" type="file" accept="image/*" onchange="previewImage(event)">
        <img id="imagePreview" alt="Forhåndsvisning">

        <div class="form-buttons">
            <button class="primary" onclick="saveItem()">Lagre</button>
            <button class="primary secondary" onclick="showTab('lager')">Avbryt</button>
        </div>
    </div>
</section>

</main>

<nav>
    <button id="nav-lager" class="active" onclick="showTab('lager')">
        <span>📦</span>Lager
    </button>
    <button id="nav-innstillinger" onclick="showTab('innstillinger')">
        <span>⚙️</span>Innstillinger
    </button>
    <button onclick="backupData()">
        <span>☁️</span>Backup
    </button>
    <button onclick="restoreData()">
        <span>📥</span>Gjenopprett
    </button>
</nav>

<script>
const ITEMS_KEY = 'hjemmelager_items';
const SETTINGS_KEY = 'hjemmelager_settings';

function createId() {
    if (window.crypto && crypto.randomUUID) {
        return crypto.randomUUID();
    }
    return 'vare-' + Date.now() + '-' + Math.random().toString(36).slice(2);
}

/* Henter varer og gir gamle varer som mangler ID en ny ID */
function loadItems() {
    try {
        const saved = JSON.parse(localStorage.getItem(ITEMS_KEY)) || [];
        let changed = false;

        const loaded = saved.map(item => {
            if (!item.id) {
                changed = true;
                return { ...item, id: createId() };
            }
            return item;
        });

        if (changed) {
            localStorage.setItem(ITEMS_KEY, JSON.stringify(loaded));
        }

        return loaded;
    } catch {
        return [];
    }
}

function loadSettings() {
    try {
        const saved = JSON.parse(localStorage.getItem(SETTINGS_KEY)) || {};

        return {
            lokasjoner: saved.lokasjoner || saved.lokasjon || ['Garasje','Container A','Container B'],
            hyller: saved.hyller || saved.hylle || ['1','2','3'],
            bokser: saved.bokser || saved.boks || ['A','B','C']
        };
    } catch {
        return {
            lokasjoner:['Garasje','Container A','Container B'],
            hyller:['1','2','3'],
            bokser:['A','B','C']
        };
    }
}

let items = loadItems();
let settings = loadSettings();
let currentImage = '';

function saveAll() {
    localStorage.setItem(ITEMS_KEY, JSON.stringify(items));
    localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
}

function escapeHTML(value) {
    return String(value ?? '').replace(/[&<>"']/g, character => ({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#039;'
    })[character]);
}

function showTab(tab) {
    document.querySelectorAll('.section').forEach(section => {
        section.classList.remove('active');
    });

    document.getElementById(tab).classList.add('active');

    document.querySelectorAll('nav button').forEach(button => {
        button.classList.remove('active');
    });

    const navButton = document.getElementById('nav-' + tab);
    if (navButton) navButton.classList.add('active');

    closeCustomSelects();

    if (tab === 'lager') renderItems();
    if (tab === 'innstillinger') renderSettings();
}

function renderItems() {
    const container = document.getElementById('itemList');
    const search = document.getElementById('searchInput').value.toLowerCase().trim();

    const filtered = items.filter(item => {
        const text = [
            item.navn, item.type, item.lokasjon,
            item.hylle, item.boks, item.notat
        ].join(' ').toLowerCase();

        return text.includes(search);
    });

    if (!filtered.length) {
        container.innerHTML = '<div class="empty">Ingen ting funnet.</div>';
        return;
    }

    container.innerHTML = filtered.map(item => `
        <div class="item">
            ${item.bilde ? `<img src="${item.bilde}" alt="">` : ''}
            <div class="item-content">
                <h3>${escapeHTML(item.navn)}</h3>
                <p>${escapeHTML(item.type || 'Ingen kategori')}</p>
                <p>📍 ${escapeHTML(item.lokasjon || '-')}</p>
                <p>Hylle: ${escapeHTML(item.hylle || '-')} · Boks: ${escapeHTML(item.boks || '-')}</p>
                <p>Antall: ${escapeHTML(item.antall ?? 1)}</p>
                <div class="actions">
                    <button class="small-btn" onclick="editItem('${escapeHTML(item.id)}')">Rediger</button>
                    <button class="small-btn delete-btn" onclick="deleteItem('${escapeHTML(item.id)}')">Slett</button>
                </div>
            </div>
        </div>
    `).join('');
}

/*
 * Lager en rullbar meny for hvert valg.
 * Den opprinnelige select-en beholdes skjult slik at resten av appen
 * fortsatt kan lese verdien på vanlig måte.
 */
function fillSelect(id, values, selected = '') {
    const select = document.getElementById(id);
    select.innerHTML = '';

    const wrap = document.createElement('div');
    wrap.className = 'select-wrap';
    wrap.dataset.selectId = id;

    const trigger = document.createElement('button');
    trigger.type = 'button';
    trigger.className = 'select-trigger';
    trigger.setAttribute('aria-haspopup', 'listbox');
    trigger.setAttribute('aria-expanded', 'false');

    const menu = document.createElement('div');
    menu.className = 'select-menu';
    menu.setAttribute('role', 'listbox');

    select.style.display = 'none';

    const updateLabel = () => {
        const value = select.value;
        const option = [...select.options].find(item => item.value === value);
        trigger.textContent = option ? option.textContent : 'Velg...';

        menu.querySelectorAll('.select-option').forEach(button => {
            const isSelected = button.dataset.value === value;
            button.classList.toggle('selected', isSelected);
            button.setAttribute('aria-selected', String(isSelected));
        });
    };

    const addOption = (value, label) => {
        const nativeOption = document.createElement('option');
        nativeOption.value = value;
        nativeOption.textContent = label;
        select.appendChild(nativeOption);

        const option = document.createElement('button');
        option.type = 'button';
        option.className = 'select-option';
        option.textContent = label;
        option.dataset.value = value;
        option.setAttribute('role', 'option');

        option.addEventListener('click', () => {
            select.value = value;
            select.dispatchEvent(new Event('change', { bubbles:true }));
            updateLabel();
            closeCustomSelects();
        });

        menu.appendChild(option);
    };

    addOption('', 'Velg...');
    values.forEach(value => addOption(value, value));

    if (selected && !values.includes(selected)) {
        addOption(selected, selected);
    }

    select.value = selected || '';

    trigger.addEventListener('click', () => {
        const wasOpen = wrap.classList.contains('open');
        closeCustomSelects();

        if (!wasOpen) {
            wrap.classList.add('open');
            trigger.setAttribute('aria-expanded', 'true');

            const selectedOption = menu.querySelector('.selected');
            if (selectedOption) {
                selectedOption.scrollIntoView({ block:'nearest' });
            }
        }
    });

    wrap.append(trigger, menu);
    select.insertAdjacentElement('afterend', wrap);

    updateLabel();
}

function closeCustomSelects() {
    document.querySelectorAll('.select-wrap.open').forEach(wrap => {
        wrap.classList.remove('open');

        const trigger = wrap.querySelector('.select-trigger');
        if (trigger) trigger.setAttribute('aria-expanded', 'false');
    });
}

document.addEventListener('click', event => {
    if (!event.target.closest('.select-wrap')) {
        closeCustomSelects();
    }
});

document.addEventListener('keydown', event => {
    if (event.key === 'Escape') closeCustomSelects();
});

function fillFormSelects(item = {}) {
    fillSelect('lokasjon', settings.lokasjoner, item.lokasjon || '');
    fillSelect('hylle', settings.hyller, item.hylle || '');
    fillSelect('boks', settings.bokser, item.boks || '');
}

function newItem() {
    clearForm();
    document.getElementById('formTitle').textContent = 'Legg til ting';
    fillFormSelects();
    showTab('rediger');
}

function clearForm() {
    document.getElementById('editId').value = '';
    document.getElementById('navn').value = '';
    document.getElementById('type').value = '';
    document.getElementById('antall').value = 1;
    document.getElementById('pris').value = '';
    document.getElementById('dato').value = '';
    document.getElementById('notat').value = '';
    document.getElementById('bilde').value = '';
    document.getElementById('imagePreview').style.display = 'none';
    currentImage = '';
}

function editItem(id) {
    const item = items.find(x => String(x.id) === String(id));

    if (!item) {
        alert('Fant ikke varen. Oppdater siden og prøv igjen.');
        return;
    }

    clearForm();

    document.getElementById('formTitle').textContent = 'Rediger ting';
    document.getElementById('editId').value = item.id;
    document.getElementById('navn').value = item.navn || '';
    document.getElementById('type').value = item.type || '';
    document.getElementById('antall').value = item.antall ?? 1;
    document.getElementById('pris').value = item.pris || '';
    document.getElementById('dato').value = item.dato || '';
    document.getElementById('notat').value = item.notat || '';

    currentImage = item.bilde || '';

    if (currentImage) {
        const preview = document.getElementById('imagePreview');
        preview.src = currentImage;
        preview.style.display = 'block';
    }

    fillFormSelects(item);
    showTab('rediger');
}

async function previewImage(event) {
    const file = event.target.files[0];
    if (!file) return;

    try {
        currentImage = await compressImage(file);

        const preview = document.getElementById('imagePreview');
        preview.src = currentImage;
        preview.style.display = 'block';
    } catch {
        alert('Kunne ikke lese bildet.');
    }
}

function compressImage(file) {
    return new Promise((resolve,reject) => {
        const reader = new FileReader();

        reader.onload = event => {
            const img = new Image();

            img.onload = () => {
                const maxSize = 1000;
                let width = img.width;
                let height = img.height;

                if (width > maxSize || height > maxSize) {
                    const scale = Math.min(maxSize / width,maxSize / height);
                    width *= scale;
                    height *= scale;
                }

                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;

                canvas.getContext('2d').drawImage(img,0,0,width,height);
                resolve(canvas.toDataURL('image/jpeg',0.75));
            };

            img.onerror = reject;
            img.src = event.target.result;
        };

        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}

function saveItem() {
    const navn = document.getElementById('navn').value.trim();

    if (!navn) {
        alert('Skriv inn et navn.');
        return;
    }

    const id = document.getElementById('editId').value;

    const item = {
        id: id || createId(),
        navn,
        type:document.getElementById('type').value.trim(),
        lokasjon:document.getElementById('lokasjon').value,
        hylle:document.getElementById('hylle').value,
        boks:document.getElementById('boks').value,
        antall:Number(document.getElementById('antall').value) || 0,
        pris:Number(document.getElementById('pris').value) || 0,
        dato:document.getElementById('dato').value,
        notat:document.getElementById('notat').value.trim(),
        bilde:currentImage
    };

    if (id) {
        const index = items.findIndex(x => String(x.id) === String(id));

        if (index === -1) {
            alert('Fant ikke varen som skulle redigeres.');
            return;
        }

        items[index] = item;
    } else {
        items.unshift(item);
    }

    try {
        saveAll();
        clearForm();
        showTab('lager');
    } catch {
        alert('Kunne ikke lagre. Lageret kan være fullt. Prøv å fjerne noen bilder.');
    }
}

function deleteItem(id) {
    const index = items.findIndex(item => String(item.id) === String(id));

    if (index === -1) {
        alert('Fant ikke varen som skulle slettes.');
        return;
    }

    if (!confirm('Vil du slette denne tingen?')) return;

    items.splice(index, 1);

    try {
        saveAll();
        renderItems();
    } catch {
        alert('Kunne ikke lagre endringen.');
    }
}

function renderSettings() {
    renderSettingList('lokasjoner','locationSettings');
    renderSettingList('hyller','shelfSettings');
    renderSettingList('bokser','boxSettings');
}

function renderSettingList(key,elementId) {
    const container = document.getElementById(elementId);

    if (!settings[key].length) {
        container.innerHTML = '<p class="info">Ingen registrert ennå.</p>';
        return;
    }

    container.innerHTML = settings[key].map((value,index) => `
        <div class="setting-row">
            <input value="${escapeHTML(value)}" readonly>
            <button onclick="removeSetting('${key}',${index})">Slett</button>
        </div>
    `).join('');
}

function addSetting(key,inputId) {
    const input = document.getElementById(inputId);
    const value = input.value.trim();

    if (!value) return;

    if (!settings[key].includes(value)) {
        settings[key].push(value);
        saveAll();
    }

    input.value = '';
    renderSettings();
}

function removeSetting(key,index) {
    const value = settings[key][index];

    if (!confirm('Slette "' + value + '" fra innstillingene?')) return;

    settings[key].splice(index,1);
    saveAll();
    renderSettings();
}

/* BACKUP */
async function backupData() {
    const data = { items, settings };

    const blob = new Blob(
        [JSON.stringify(data,null,2)],
        { type:'application/json' }
    );

    const file = new File(
        [blob],
        `backup-${new Date().toISOString().replace(/:/g,'-')}.json`,
        { type:'application/json' }
    );

    if (navigator.canShare && navigator.canShare({files:[file]})) {
        try {
            await navigator.share({
                files:[file],
                title:'Hjemmelager Backup'
            });
        } catch (error) {
            if (error.name !== 'AbortError') {
                alert('Kunne ikke åpne delingsmenyen.');
            }
        }
    } else {
        alert('Backup fungerer best på iOS med delingsfunksjon. Bruk PC/Mac for full nedlasting.');
    }
}

/* GJENOPPRETT */
function restoreData() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'application/json';

    input.onchange = event => {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();

        reader.onload = evt => {
            try {
                const data = JSON.parse(evt.target.result);

                if (!Array.isArray(data.items) || !data.settings) {
                    alert('Ugyldig backup-fil');
                    return;
                }

                if (!confirm('Dette vil overskrive eksisterende lager. Fortsette?')) return;

                items = data.items.map(item => ({
                    ...item,
                    id: item.id || createId()
                }));

                const saved = data.settings;

                settings = {
                    lokasjoner:saved.lokasjoner || saved.lokasjon || [],
                    hyller:saved.hyller || saved.hylle || [],
                    bokser:saved.bokser || saved.boks || []
                };

                saveAll();
                renderSettings();
                renderItems();
                alert('Gjenoppretting fullført');
                showTab('lager');

            } catch {
                alert('Kunne ikke lese backup-fil');
            }
        };

        reader.readAsText(file);
    };

    input.click();
}

// Start appen
renderItems();
renderSettings();
</script>

</body>
</html>
